# Daily production rebuild on Vercel.
# Why: build-time content (upcoming vs. past events, the "Tonight" card's first render, the footer year)
# is computed when the site is built, so a nightly rebuild keeps it current even when nothing is pushed.
# The Vercel deploy hook URL lives ONLY in the repo secret VERCEL_DEPLOY_HOOK (never commit it).
# Create it in Vercel: Project roxys-restobar > Settings > Git > Deploy Hooks (branch: main),
# then: gh secret set VERCEL_DEPLOY_HOOK -R madisondesignprojects-ship-it/Roxys-Restobar
name: Daily rebuild

on:
  schedule:
    - cron: '15 10 * * *'   # 10:15 UTC = 5:15 AM CDT / 4:15 AM CST, after the 2:30 AM close
  workflow_dispatch: {}

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set; skipping rebuild."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "Deploy hook HTTP %{http_code}\n"
